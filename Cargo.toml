[package]
name = "order_risk_assessment_ms"
version = "0.1.0"
authors = ["luizinhoab <luizinhoab@gmail.com>"]
edition ="2021"

[dependencies]
actix= {version="0.13.5"}
actix-rt = {version = "2.10.0"}
actix-web = {version = "4.8.0"}
actix-files = {version = "0.6.6"}
log = {version = "0.4.22"}
env_logger = {version = "0.11.5"}
dotenv = {version = "0.15.0"}
serde = {version = "1.0.204"}
serde_derive = {  version = "1.0.204"}
serde_json = {version="1.0.121"}
chrono = { version = "0.4.38" , features = ["serde"]}
uuid = { version = "1.10.0", features = ["serde", "v4"]}
r2d2 = {version = "0.8.10"}
diesel = { version = "2.2.2", features = ["postgres", "r2d2", "chrono", "uuid"] }
diesel_migrations = {version = "2.2.0"}
derive_more = {version = "1.0.0-beta.6", features = ["display"]  }
validator = { version = "0.18.1" }
validator_derive = { version = "0.18.1" }
async-trait = {version = "0.1.81"}
regex = { version = "1.10.5"}
reqwest = { version = "0.12.5", features = ["json"] }
once_cell = "1.19.0"

[dev-dependencies]
mockall = { version = "0.13.0"}
httpmock = {version = "0.7.0"}

